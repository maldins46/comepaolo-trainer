name: Build & deploy dashboard

on:
  schedule:
    # 09:00 Europe/Rome, all year. Cron is UTC and ignores daylight saving, so both
    # candidates are scheduled and the check below keeps the one that is 09:00 in Rome.
    - cron: '0 7 * * *'    # 09:00 Rome in summer time (CEST)
    - cron: '0 8 * * *'    # 09:00 Rome in winter time (CET)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Decides whether this run is the one that lands at 09:00 in Rome.
  # Uses Rome's current UTC offset (+0200 summer, +0100 winter), not the clock hour,
  # so a run that GitHub starts late is not skipped by mistake.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(TZ=Europe/Rome date +%z)" = "+0200" ]; then want='0 7 * * *'; else want='0 8 * * *'; fi
          if [ "${{ github.event.schedule }}" = "$want" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Fetch from Hevy and Drive
        run: npm run fetch
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_REPORTS_FOLDER_ID: ${{ vars.DRIVE_REPORTS_FOLDER_ID }}
          DRIVE_DATA_FOLDER_ID: ${{ vars.DRIVE_DATA_FOLDER_ID }}
          DRIVE_OVERRIDES_DOC_ID: ${{ vars.DRIVE_OVERRIDES_DOC_ID }}
      - name: Build and encrypt
        run: npm run build
        env:
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
      - name: Refuse to publish plaintext
        run: |
          test ! -e dist/data.json
          leaks=$(grep -rlE '"(weight_kg|bodyweight|workouts)"' dist/ | grep -v 'data.enc.json' || true)
          if [ -n "$leaks" ]; then echo "Plaintext data found in: $leaks"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
