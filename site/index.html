<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Recomposition — 12 weeks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<style>
  :root {
    --bg: #f3f5f7; --surface: #ffffff; --ink: #14202b; --muted: #5d6b78; --line: #d7dde3;
    --accent: #1f6feb; --done: #2f855a; --warn: #b7791f; --bad: #c53030;
    --radius: 10px;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink); background: var(--bg);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f151b; --surface: #17202a; --ink: #e6edf3; --muted: #93a1ad; --line: #2a3643; --accent: #58a6ff; }
  }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; min-height: 100vh; background: var(--bg); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  button, input { font: inherit; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #gate { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  #gate form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; width: min(380px, 100%); display: grid; gap: 14px; }
  #gate input[type=password] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  #gate label.check { display: flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); }
  #gate .error { color: var(--bad); font-size: .9rem; min-height: 1.2em; margin: 0; }

  .weeks { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; margin: 24px 0; }
  .wk { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px; font-size: .8rem; text-align: center; }
  .wk b { display: block; font-size: 1rem; }
  .wk.current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .wk.future { opacity: .55; }
  .wk .dots { letter-spacing: 2px; }
  @media (max-width: 700px) { .weeks { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  pre { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; overflow-x: auto; font-size: .8rem; max-height: 60vh; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="gate">
  <form id="unlock">
    <div>
      <h1>Recomposition</h1>
      <p class="muted" style="margin:0">Your data is encrypted. Enter the passphrase to open it.</p>
    </div>
    <input type="password" id="pass" autocomplete="current-password" placeholder="Passphrase" required>
    <label class="check"><input type="checkbox" id="remember"> Remember on this device</label>
    <button type="submit" id="go">Open</button>
    <p class="error" id="err" role="alert"></p>
  </form>
</div>

<main id="app" hidden></main>

<script>
// ---- decryption: must mirror scripts/lib/crypto.js ----
const KEY_STORE = 'hevy-dash-key-v1';
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function deriveKey(pass, env) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(env.salt), iterations: env.iterations, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}

async function decrypt(env, key) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(env.iv) }, key, b64(env.data));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

async function loadEnvelope() {
  const res = await fetch('data.enc.json', { cache: 'no-store' });
  return res.ok ? res.json() : null;
}

async function start() {
  const env = await loadEnvelope();
  if (!env) {
    // `npm run dev` serves plaintext data at /data.json for UI work.
    const dev = await fetch('/data.json', { cache: 'no-store' }).catch(() => null);
    if (dev?.ok) return render(await dev.json());
    document.getElementById('err').textContent = 'No data found. Run the build first.';
    return;
  }
  try {
    const saved = localStorage.getItem(KEY_STORE);
    if (saved) {
      const key = await crypto.subtle.importKey('jwk', JSON.parse(saved), 'AES-GCM', false, ['decrypt']);
      return render(await decrypt(env, key));
    }
  } catch { try { localStorage.removeItem(KEY_STORE); } catch {} }

  document.getElementById('unlock').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Opening…'; err.textContent = '';
    try {
      const key = await deriveKey(document.getElementById('pass').value, env);
      const data = await decrypt(env, key);
      if (document.getElementById('remember').checked) {
        try { localStorage.setItem(KEY_STORE, JSON.stringify(await crypto.subtle.exportKey('jwk', key))); } catch {}
      }
      render(data);
    } catch {
      err.textContent = 'Wrong passphrase.';
      btn.disabled = false; btn.textContent = 'Open';
    }
  });
}

function lock() {
  try { localStorage.removeItem(KEY_STORE); } catch {}
  location.reload();
}

// ---- placeholder view: replaced by the real dashboard (see CLAUDE.md) ----
function render(data) {
  document.getElementById('gate').hidden = true;
  const app = document.getElementById('app');
  app.hidden = false;
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cw = data.cycle.currentWeek;
  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:16px;align-items:start;flex-wrap:wrap">
      <div>
        <h1>Week ${Math.min(Math.max(cw, 0), 12)} of 12</h1>
        <p class="muted" style="margin:0">Updated ${new Date(data.generatedAt).toLocaleString('en-GB')}</p>
      </div>
      <button onclick="lock()">Lock</button>
    </div>
    <div class="weeks">
      ${data.weeks.map((w) => `
        <div class="wk ${w.state}" title="${esc(w.phase)}">
          <b>S${w.week}</b>
          <span class="dots">${['A','B','C'].map((s) => w.sessions[s] ? '●' : '○').join('')}${w.run ? '▲' : '△'}</span><br>
          <span class="muted">${w.bodyweight?.avg ? w.bodyweight.avg.toFixed(1) + ' kg' : '—'}</span>
        </div>`).join('')}
    </div>
    <p class="muted">Placeholder view. Below is the full data.json the dashboard will render.</p>
    <pre>${esc(JSON.stringify(data, null, 2))}</pre>`;
}

start();
</script>
</body>
</html>
