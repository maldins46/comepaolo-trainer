<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Recomposition — 12 weeks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="gate">
  <form id="unlock">
    <div>
      <h1>Recomposition</h1>
      <p class="muted" style="margin:0">Your data is encrypted. Enter the passphrase to open it.</p>
    </div>
    <input type="password" id="pass" autocomplete="current-password" placeholder="Passphrase" required>
    <label class="check"><input type="checkbox" id="remember"> Remember on this device</label>
    <button type="submit" id="go">Open</button>
    <p class="error" id="err" role="alert"></p>
  </form>
</div>

<main id="app" hidden></main>

<script>
// ---- decryption: must mirror scripts/lib/crypto.js ----
const KEY_STORE = 'hevy-dash-key-v1';
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function deriveKey(pass, env) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(env.salt), iterations: env.iterations, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}

async function decrypt(env, key) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(env.iv) }, key, b64(env.data));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

async function loadEnvelope() {
  const res = await fetch('data.enc.json', { cache: 'no-store' });
  return res.ok ? res.json() : null;
}

async function start() {
  const { mountApp } = await import('./app.js');
  const env = await loadEnvelope();
  if (!env) {
    // `npm run dev` serves plaintext data at /data.json for UI work.
    const dev = await fetch('/data.json', { cache: 'no-store' }).catch(() => null);
    if (dev?.ok) return mountApp(await dev.json());
    document.getElementById('err').textContent = 'No data found. Run the build first.';
    return;
  }
  try {
    const saved = localStorage.getItem(KEY_STORE);
    if (saved) {
      const key = await crypto.subtle.importKey('jwk', JSON.parse(saved), 'AES-GCM', false, ['decrypt']);
      return mountApp(await decrypt(env, key));
    }
  } catch { try { localStorage.removeItem(KEY_STORE); } catch {} }

  document.getElementById('unlock').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Opening…'; err.textContent = '';
    try {
      const key = await deriveKey(document.getElementById('pass').value, env);
      const data = await decrypt(env, key);
      if (document.getElementById('remember').checked) {
        try { localStorage.setItem(KEY_STORE, JSON.stringify(await crypto.subtle.exportKey('jwk', key))); } catch {}
      }
      mountApp(data);
    } catch {
      err.textContent = 'Wrong passphrase.';
      btn.disabled = false; btn.textContent = 'Open';
    }
  });
}

function lock() {
  try { localStorage.removeItem(KEY_STORE); } catch {}
  location.reload();
}

start();
</script>
</body>
</html>
